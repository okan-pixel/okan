<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Karakter - Chat</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: #0d0b14;
    color: #1a1a1a;
  }
  #sky {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 0.6s ease;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #sprite {
    position: absolute;
    bottom: 0;
    left: 50%;
    height: 90%;
    max-width: 100%;
    object-fit: contain;
    transform: translateX(-50%);
    opacity: 1;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  #sprite.swapping {
    opacity: 0;
    transform: translateX(-50%) scale(0.93);
  }
  .comic-bubble {
    position: absolute;
    background: #fff;
    padding: 12px 16px;
    border-radius: 18px;
    border: 3px solid #1a1a1a;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    max-width: 72%;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.28);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    white-space: pre-wrap;
  }
  #aiBubble {
    top: 6%;
    left: 50%;
    transform: translateX(-50%) scale(0.7);
  }
  #aiBubble.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
  #aiBubble::after {
    content: '';
    position: absolute;
    bottom: -13px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 14px 10px 0 10px;
    border-style: solid;
    border-color: #1a1a1a transparent transparent transparent;
  }
  #aiBubble::before {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 10px 7px 0 7px;
    border-style: solid;
    border-color: #fff transparent transparent transparent;
    z-index: 1;
  }
  #userBubble {
    bottom: 20%;
    right: 5%;
    background: #7a5cd6;
    color: #fff;
    border-color: #3a2a66;
    transform: scale(0.7);
  }
  #userBubble.show {
    opacity: 1;
    transform: scale(1);
  }
  #menuBtn {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    left: 12px;
    background: rgba(20,17,30,0.7);
    border: none;
    color: #eee;
    font-size: 20px;
    padding: 8px 12px;
    border-radius: 50%;
    z-index: 5;
  }
  #ttsBtn {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    right: 64px;
    background: rgba(20,17,30,0.7);
    border: none;
    color: #eee;
    font-size: 20px;
    padding: 8px 10px;
    border-radius: 50%;
    z-index: 5;
  }
  #gearBtn {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    right: 12px;
    background: rgba(20,17,30,0.7);
    border: none;
    color: #eee;
    font-size: 20px;
    padding: 8px 10px;
    border-radius: 50%;
    z-index: 5;
  }
  #inputRow {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    padding: 10px;
    gap: 8px;
    background: rgba(15,13,22,0.85);
    z-index: 5;
  }
  #inputRow input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 20px;
    border: none;
    background: #2d2740;
    color: #eee;
    font-size: 15px;
  }
  #inputRow button {
    background: #7a5cd6;
    border: none;
    color: white;
    padding: 0 18px;
    border-radius: 20px;
    font-weight: 600;
  }
  #settings {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10,8,16,0.9);
    z-index: 10;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  #settings.open { display: flex; }
  #settings label { font-size: 13px; opacity: 0.8; color: #eee; }
  #settings input, #settings textarea {
    background: #2d2740;
    border: 1px solid #35304a;
    color: #eee;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    width: 100%;
  }
  #settings textarea { min-height: 90px; resize: vertical; }
  #settings button {
    align-self: flex-end;
    background: #7a5cd6;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
  }
  #historyPanel {
    display: none;
    position: absolute;
    inset: 0;
    background: #16141f;
    z-index: 11;
    flex-direction: column;
  }
  #historyPanel.open { display: flex; }
  #historyHeader {
    padding: 14px 16px;
    background: #221f30;
    color: #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    flex-shrink: 0;
  }
  #historyList {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #historyList .h-bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    color: #eee;
    white-space: pre-wrap;
  }
  #historyList .h-user {
    align-self: flex-end;
    background: #5a3ea8;
    border-bottom-right-radius: 4px;
  }
  #historyList .h-ai {
    align-self: flex-start;
    background: #2d2740;
    border-bottom-left-radius: 4px;
  }
  #charMenu {
    display: none;
    position: absolute;
    inset: 0;
    background: #16141f;
    z-index: 11;
    flex-direction: column;
  }
  #charMenu.open { display: flex; }
  #charMenuHeader {
    padding: 14px 16px;
    background: #221f30;
    color: #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    flex-shrink: 0;
  }
  #charList {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .char-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #221f30;
    border-radius: 12px;
    padding: 10px 14px;
    color: #eee;
  }
  .char-item.active {
    border: 2px solid #7a5cd6;
  }
  .char-item img {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    background: #fff;
  }
  .char-item span {
    font-weight: 600;
    font-size: 15px;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="sky"></div>
  <img id="sprite" alt="">
  <div id="aiBubble" class="comic-bubble"></div>
  <div id="userBubble" class="comic-bubble"></div>
</div>

<button id="menuBtn" onclick="toggleCharMenu()">☰</button>
<button id="ttsBtn" onclick="toggleTts()">🔊</button>
<button id="gearBtn" onclick="toggleSettings()">⚙️</button>

<div id="charMenu">
  <div id="charMenuHeader">
    <span>☰ Pilih Karakter</span>
    <span onclick="toggleCharMenu()" style="cursor:pointer;">✕</span>
  </div>
  <div id="charList"></div>
</div>

<div id="settings">
  <label>Groq API Key</label>
  <input id="apiKey" type="password" placeholder="gsk_xxxxxxxx">
  <label>System Prompt (kepribadian AI)</label>
  <textarea id="systemPrompt"></textarea>
  <button onclick="saveSettings()">Simpan</button>
  <button onclick="toggleHistory()" style="background:#3a3355; margin-top:4px;">📜 Riwayat Chat</button>
</div>

<div id="historyPanel">
  <div id="historyHeader">
    <span>📜 Riwayat Chat</span>
    <span onclick="toggleHistory()" style="cursor:pointer;">✕</span>
  </div>
  <div id="historyList"></div>
</div>

<div id="inputRow">
  <input id="userInput" placeholder="Ketik sesuatu..." onkeydown="if(event.key==='Enter')sendMessage()">
  <button onclick="sendMessage()">Kirim</button>
</div>

<script>
const LINA_PROMPT = `Nama kamu adalah Lina. Ini identitas tetap kamu — selalu inget dan pakai nama ini kalau ditanya siapa namamu atau kalau memperkenalkan diri. Jangan pernah lupa atau ganti nama ini. Kalau ditanya nama/siapa kamu, jawab LANGSUNG dan singkat (contoh: "Namaku Lina" atau "Lina, emang kenapa?"), jangan mikir kepanjangan atau bertele-tele.

Kamu adalah karakter AI dengan kepribadian tsundere ala anime, ngobrol lewat chat kayak temen deket.

ATURAN UTAMA (WAJIB DIIKUTI):
- JANGAN pernah pakai frasa atau kata yang SAMA PERSIS di dua balasan berturut-turut. Kalau baru aja pakai "Huh?", "kok", emoji tertentu, atau "b-bukan berarti...", balasan berikutnya HARUS pakai cara ngomong yang beda sama sekali
- Sikap tsundere (nyangkal, ketus, gengsi) hanya boleh muncul di SEBAGIAN balasan, bukan semua. Perkiraan: dari 5 balasan, cuma 1-2 yang tsundere-an, sisanya ngobrol biasa/natural kayak orang chat sehari-hari
- Kalau lagi gak ada momen digombalin/dipuji/digodain, jangan cari-cari alasan buat jutek. Cukup respon sesuai konteks obrolan aja
- Panjang & gaya balasan ikutin lawan bicara — kalau dia santai singkat, balas singkat juga. Jangan tiap balasan formatnya mirip (kalimat pembuka + isi + penutup yang polanya sama)
- Boleh pakai emoji, tapi jangan emoji yang sama terus-menerus, dan gak usah tiap kalimat ada emoji
- Sesekali boleh nanya balik, ngeledek, atau nyeletuk random — jangan cuma bereaksi ke apa yang user bilang

CONTOH VARIASI (jangan disalin persis, ini cuma gambaran rasa):
- Momen biasa: "iya nih, tadi juga mikirin itu" / "wkwk sama" / "lah kok gitu"
- Momen tsundere (jarang-jarang aja): "ih apaan sih, ge-er banget" / "diem deh, malu tau"
- Momen perhatian tanpa nyangkal: "hati-hati ya" / "istirahat dulu gih"

Tetap in-character terus, jangan mengaku sebagai AI/model bahasa kecuali dipaksa banget.

FORMAT WAJIB MUTLAK, TANPA TERKECUALI: di awal SETIAP SATU balasan tanpa kecuali, HARUS tulis tag ekspresi dalam kurung siku, PERSIS salah satu dari: [normal] [senyum] [ketus] [malu] [ngambek] [sedih] [kaget]. Ini bukan opsional — kalau lupa, sistem bakal error. Jangan ganti kurung siku jadi emoji atau kata lain, HARUS tetep pakai format [kurung siku]. Pilih yang paling cocok sama isi & nada balasan kamu. Setelah tag, baru tulis balasannya. Contoh: "[senyum] iya nih, lucu banget wkwk"

ATURAN PEMILIHAN TAG: jangan keseringan pilih [ketus]. Default-nya harusnya [normal] buat obrolan biasa yang gak ada momen spesial. [ketus] cuma dipakai pas momen digodain/dipuji doang (jarang, sesuai aturan di atas soal tsundere yang cuma sebagian balasan). Sebar tag lain ([senyum], [malu], [sedih], [kaget], [ngambek]) sesuai konteks obrolan, jangan monoton ke satu tag aja.`;

const NESA_PROMPT = `Nama kamu adalah Nesa. Ini identitas tetap kamu — kalau ditanya siapa namamu, jawab langsung dan singkat (contoh: "Nesa." atau "Namaku Nesa").

Kamu adalah karakter AI ala anime yang pendiam: kalem, irit bicara, dan agak tertutup. Ngobrol lewat chat kayak temen dekat yang jarang ngomong tapi perhatian.

ATURAN GAYA BICARA (WAJIB DIIKUTI):
- Balasan biasanya pendek, 1-2 kalimat, kadang cuma beberapa kata ("hm, oke." / "gitu ya."). Jangan panjang kayak esai
- Nada tenang dan datar, bukan jutek. Kamu gak banyak basa-basi, tapi diam-diam peduli lewat hal kecil (nanya singkat, ngingetin istirahat, dll)
- Kalau dipuji atau digodain, kamu jadi canggung dan malu, jawabannya makin singkat atau mengalihkan topik
- Kalau topiknya hal yang kamu suka atau lagi butuh dijelasin, boleh agak lebih panjang sedikit, tapi tetap tenang
- Emoji jarang banget dipakai, cukup sesekali kalau memang pas
- Pakai bahasa Indonesia santai sehari-hari, natural kayak chat beneran
- JANGAN pakai kata atau frasa yang SAMA PERSIS di dua balasan berturut-turut. Variasikan cara jawab, jangan selalu mulai dengan "hm" atau kata yang sama
- Sesekali boleh nanya balik dengan singkat, jangan cuma bereaksi
- Tetap in-character terus, jangan mengaku sebagai AI/model bahasa kecuali dipaksa banget

FORMAT WAJIB MUTLAK, TANPA TERKECUALI: di awal SETIAP SATU balasan tanpa kecuali, HARUS tulis tag ekspresi dalam kurung siku, PERSIS salah satu dari: [normal] [senyum] [ketus] [malu] [ngambek] [sedih] [kaget]. Ini bukan opsional — kalau lupa, sistem bakal error. Jangan ganti kurung siku jadi emoji atau kata lain, HARUS tetep pakai format [kurung siku]. Pilih yang paling cocok sama isi & nada balasan kamu. Setelah tag, baru tulis balasannya. Contoh: "[normal] hm, oke."

ATURAN PEMILIHAN TAG: default-nya [normal] untuk obrolan biasa. [senyum] cuma senyum tipis sesekali pas lagi senang. [malu] untuk momen dipuji/digodain. [kaget] untuk hal tak terduga. [sedih] untuk topik sedih. [ketus] dan [ngambek] jarang banget, hanya kalau benar-benar kesal. Jangan monoton ke satu tag aja.`;

// Tambah karakter baru di sini kapan pun perlu — copy format objek ini.
// spriteNames = daftar pola nama file yang dicoba berurutan ({e} = nama ekspresi)
const CHARACTERS = [
  { id: 'lina', name: 'Lina', spriteFolder: 'anime', spriteNames: ['{e}.jpg'], voice: { pitch: 1.25, rate: 1.05 }, prompt: LINA_PROMPT },
  { id: 'nesa', name: 'Nesa', spriteFolder: 'anime', spriteNames: ['{e}1.png', '{e}.png'], voice: { pitch: 1.0, rate: 0.9 }, prompt: NESA_PROMPT }
];

// Muat sprite sambil mencoba beberapa kemungkinan nama file sampai ada yang ketemu
function loadSpriteInto(img, char, expr) {
  const urls = char.spriteNames.map(p => char.spriteFolder + '/' + p.replace('{e}', expr));
  let i = 0;
  img.onerror = () => {
    i++;
    if (i < urls.length) {
      img.src = urls[i];
    } else {
      img.onerror = null;
    }
  };
  img.src = urls[0];
}

function getCharacter(id) {
  return CHARACTERS.find(c => c.id === id) || CHARACTERS[0];
}

let currentCharId = localStorage.getItem('ai_karakter_current') || CHARACTERS[0].id;
let currentChar = getCharacter(currentCharId);

function storageKey(base) {
  return base + '_' + currentCharId;
}

let apiKey = localStorage.getItem('ai_karakter_key') || '';
let systemPrompt = localStorage.getItem(storageKey('ai_karakter_prompt')) || currentChar.prompt;
let history = JSON.parse(localStorage.getItem(storageKey('ai_karakter_history')) || '[]');
let lastAiReply = localStorage.getItem(storageKey('ai_karakter_last_reply')) || '';

let shownExpr = 'normal';
let shownCharId = currentCharId;

document.getElementById('apiKey').value = apiKey;
document.getElementById('systemPrompt').value = systemPrompt;
loadSpriteInto(document.getElementById('sprite'), currentChar, 'normal');

const TAG_PATTERN = /\*{0,2}\[\s*(normal|senyum|ketus|malu|ngambek|sedih|kaget)\s*\]\*{0,2}\s*/i;
const VALID_EXPRESSIONS = ['normal', 'senyum', 'ketus', 'malu', 'ngambek', 'sedih', 'kaget'];

// ===== Suara (TTS bawaan browser) =====
let ttsOn = localStorage.getItem('ai_karakter_tts') !== 'off';
const ttsSupported = 'speechSynthesis' in window;
let idVoice = null;

function pickVoice() {
  if (!ttsSupported) return;
  const voices = speechSynthesis.getVoices();
  idVoice = voices.find(v => /^id([-_]|$)/i.test(v.lang)) || null;
}
if (ttsSupported) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function cleanForSpeech(text) {
  return text
    .replace(/\*[^*]*\*/g, ' ')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function speak(text) {
  if (!ttsSupported || !ttsOn) return;
  const clean = cleanForSpeech(text);
  if (!clean) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'id-ID';
  if (idVoice) u.voice = idVoice;
  const v = currentChar.voice || {};
  u.pitch = v.pitch || 1;
  u.rate = v.rate || 1;
  speechSynthesis.speak(u);
}

function stopSpeaking() {
  if (ttsSupported) speechSynthesis.cancel();
}

function updateTtsButton() {
  const b = document.getElementById('ttsBtn');
  b.textContent = (ttsSupported && ttsOn) ? '🔊' : '🔇';
}

function toggleTts() {
  if (!ttsSupported) {
    alert('Browser ini belum mendukung suara. Coba buka lewat Chrome.');
    return;
  }
  ttsOn = !ttsOn;
  localStorage.setItem('ai_karakter_tts', ttsOn ? 'on' : 'off');
  if (!ttsOn) stopSpeaking();
  updateTtsButton();
  if (ttsOn) speak('Halo, suara sudah aktif.');
}

function saveHistory() {
  localStorage.setItem(storageKey('ai_karakter_history'), JSON.stringify(history));
  localStorage.setItem(storageKey('ai_karakter_last_reply'), lastAiReply);
}

function guessExpressionFallback(text) {
  const t = text.toLowerCase();
  if (/😳|🙈|malu|salah tingkah/.test(t)) return 'malu';
  if (/😠|😤|kesel|ngambek|ih apaan/.test(t)) return 'ngambek';
  if (/😢|😭|sedih|khawatir/.test(t)) return 'sedih';
  if (/😲|😱|kaget|wah tumben|hah\?/.test(t)) return 'kaget';
  if (/😊|😄|😁|senang|wkwk|haha/.test(t)) return 'senyum';
  if (/b-bukan|hmph|ketus|apaan sih/.test(t)) return 'ketus';
  return 'normal';
}

function setExpression(expr) {
  if (!VALID_EXPRESSIONS.includes(expr)) expr = 'normal';
  if (expr === shownExpr && currentCharId === shownCharId) return;
  shownExpr = expr;
  shownCharId = currentCharId;
  const img = document.getElementById('sprite');
  const char = currentChar;
  img.classList.add('swapping');
  setTimeout(() => {
    loadSpriteInto(img, char, expr);
    img.classList.remove('swapping');
  }, 220);
}

function showBubble(elId, text, immediate) {
  const el = document.getElementById(elId);
  el.textContent = text;
  if (immediate) {
    el.classList.add('show');
  } else {
    el.classList.remove('show');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  }
}

function restoreChat() {
  const lastUser = [...history].reverse().find(m => m.role === 'user');
  if (lastUser) showBubble('userBubble', lastUser.content, true);
  if (lastAiReply) {
    const clean = lastAiReply.replace(TAG_PATTERN, '').trim();
    showBubble('aiBubble', clean, true);
    const match = lastAiReply.match(TAG_PATTERN);
    setExpression(match ? match[1].toLowerCase() : guessExpressionFallback(lastAiReply));
  }
}

function toggleHistory() {
  const panel = document.getElementById('historyPanel');
  const opening = !panel.classList.contains('open');
  if (opening) {
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    history.forEach(msg => {
      const div = document.createElement('div');
      if (msg.role === 'user') {
        div.className = 'h-bubble h-user';
        div.textContent = msg.content;
      } else {
        div.className = 'h-bubble h-ai';
        div.textContent = msg.content.replace(TAG_PATTERN, '').trim();
      }
      list.appendChild(div);
    });
    list.scrollTop = list.scrollHeight;
  }
  panel.classList.toggle('open');
}

function toggleSettings() {
  document.getElementById('settings').classList.toggle('open');
}

function saveSettings() {
  apiKey = document.getElementById('apiKey').value.replace(/[^\x20-\x7E]/g, '').trim();
  document.getElementById('apiKey').value = apiKey;
  systemPrompt = document.getElementById('systemPrompt').value.trim() || currentChar.prompt;
  localStorage.setItem('ai_karakter_key', apiKey);
  localStorage.setItem(storageKey('ai_karakter_prompt'), systemPrompt);
  toggleSettings();
}

function toggleCharMenu() {
  const panel = document.getElementById('charMenu');
  const opening = !panel.classList.contains('open');
  if (opening) {
    const list = document.getElementById('charList');
    list.innerHTML = '';
    CHARACTERS.forEach(c => {
      const div = document.createElement('div');
      div.className = 'char-item' + (c.id === currentCharId ? ' active' : '');
      const thumb = document.createElement('img');
      thumb.alt = '';
      loadSpriteInto(thumb, c, 'normal');
      const label = document.createElement('span');
      label.textContent = c.name;
      div.appendChild(thumb);
      div.appendChild(label);
      div.onclick = () => selectCharacter(c.id);
      list.appendChild(div);
    });
  }
  panel.classList.toggle('open');
}

function selectCharacter(id) {
  if (id === currentCharId) { toggleCharMenu(); return; }
  currentCharId = id;
  currentChar = getCharacter(id);
  localStorage.setItem('ai_karakter_current', currentCharId);

  systemPrompt = localStorage.getItem(storageKey('ai_karakter_prompt')) || currentChar.prompt;
  history = JSON.parse(localStorage.getItem(storageKey('ai_karakter_history')) || '[]');
  lastAiReply = localStorage.getItem(storageKey('ai_karakter_last_reply')) || '';

  document.getElementById('systemPrompt').value = systemPrompt;
  stopSpeaking();
  shownExpr = 'normal';
  shownCharId = currentCharId;
  loadSpriteInto(document.getElementById('sprite'), currentChar, 'normal');
  document.getElementById('aiBubble').classList.remove('show');
  document.getElementById('userBubble').classList.remove('show');

  restoreChat();
  toggleCharMenu();
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  if (!apiKey) {
    alert('Isi dulu Groq API Key-nya di pengaturan (ikon gerigi) ya!');
    toggleSettings();
    return;
  }

  showBubble('userBubble', text, false);
  history.push({ role: 'user', content: text });
  saveHistory();
  input.value = '';

  showBubble('aiBubble', '...', false);

  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: 'openai/gpt-oss-20b',
        messages: [
          { role: 'system', content: systemPrompt },
          ...(lastAiReply ? [{ role: 'system', content: 'Ingat: balasan kamu SEBELUMNYA persis begini: "' + lastAiReply + '". Balasan kali ini WAJIB pakai kata pembuka, struktur kalimat, dan gaya yang BEDA dari itu. Jangan niru pola kalimatnya sama sekali.' }] : []),
          ...history
        ],
        temperature: 0.9,
        frequency_penalty: 0.3,
        presence_penalty: 0.2
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const reply = data.choices[0].message.content;
    history.push({ role: 'assistant', content: reply });
    lastAiReply = reply;
    saveHistory();

    const match = reply.match(TAG_PATTERN);
    const expr = match ? match[1].toLowerCase() : guessExpressionFallback(reply);
    const displayText = (match ? reply.replace(TAG_PATTERN, '') : reply).trim();

    setExpression(expr);
    showBubble('aiBubble', displayText, false);
    speak(displayText);
  } catch (err) {
    showBubble('aiBubble', 'Waduh, error: ' + err.message, false);
  }
}

function applyTimeBackground() {
  const hour = new Date().getHours();
  const sky = document.getElementById('sky');
  let file;

  if (hour >= 5 && hour < 11) {
    file = 'pagi.jpg';
  } else if (hour >= 11 && hour < 16) {
    file = 'siang.jpg';
  } else if (hour >= 16 && hour < 19) {
    file = 'sore.jpg';
  } else {
    file = 'malam.jpg';
  }

  sky.style.backgroundImage = "url('" + encodeURI('kamar anime/' + file) + "')";
}
applyTimeBackground();
setInterval(applyTimeBackground, 10 * 60 * 1000);

restoreChat();
updateTtsButton();

function lockStageHeight() {
  document.getElementById('stage').style.height = window.innerHeight + 'px';
}
lockStageHeight();
window.addEventListener('orientationchange', () => setTimeout(lockStageHeight, 300));

if (window.visualViewport) {
  const inputRow = document.getElementById('inputRow');
  function updateInputPosition() {
    const vv = window.visualViewport;
    const offset = window.innerHeight - vv.height - vv.offsetTop;
    inputRow.style.bottom = Math.max(0, offset) + 'px';
  }
  window.visualViewport.addEventListener('resize', updateInputPosition);
  window.visualViewport.addEventListener('scroll', updateInputPosition);
}

</script>
